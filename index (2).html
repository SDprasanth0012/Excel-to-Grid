<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Excel to Grid Tool</title>
<style>
  :root {
    --bg: #f0f4f8;
    --surface: #ffffff;
    --border: #d1d9e0;
    --text: #1a2332;
    --muted: #6b7a8d;
    --accent: #1d4ed8;
    --success: #15803d;
    --success-bg: #dcfce7;
    --success-border: #86efac;
    --header-bg: #1e3a5f;
    --header-text: #e8f0fe;
    --row-alt: #f7f9fc;
    --row-hover: #e8f0fe;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --row-alt: #1c2128;
      --row-hover: #1f2d3d;
      --header-bg: #0d1117;
      --header-text: #c9d1d9;
      --success-bg: #14532d;
      --success-border: #166534;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
    padding: 20px 14px;
    padding-top: calc(20px + env(safe-area-inset-top,0px));
    padding-bottom: calc(20px + env(safe-area-inset-bottom,0px));
  }
  h1 { font-size: 1.1rem; font-weight: 700; margin-bottom: 4px; }
  .sub { font-size: 0.75rem; color: var(--muted); margin-bottom: 16px; }

  /* Paste area */
  .paste-section { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 16px; }
  .paste-section label { font-size: 0.78rem; font-weight: 600; color: var(--muted); display: block; margin-bottom: 6px; }
  textarea {
    width: 100%; height: 140px; border: 1px solid var(--border); border-radius: 7px;
    padding: 8px 10px; font-size: 0.78rem; font-family: monospace;
    background: var(--bg); color: var(--text); resize: vertical; outline: none;
  }
  textarea:focus { border-color: var(--accent); }
  .btn-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .btn {
    padding: 7px 18px; border-radius: 7px; font-size: 0.82rem; font-weight: 600;
    cursor: pointer; border: none; transition: opacity .15s;
  }
  .btn:hover { opacity: .85; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-secondary { background: var(--border); color: var(--text); }

  /* Format hint */
  .hint { font-size: 0.72rem; color: var(--muted); margin-top: 8px; }

  /* Result section */
  #result-section { display: none; }
  .toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .toolbar input {
    flex: 1; min-width: 160px; padding: 7px 12px; border: 1px solid var(--border);
    border-radius: 7px; font-size: 0.82rem; background: var(--surface);
    color: var(--text); outline: none;
  }
  .toolbar input:focus { border-color: var(--accent); }
  .count { font-size: 0.72rem; color: var(--muted); white-space: nowrap; }

  .tbl-wrap { overflow-x: auto; border-radius: 10px; box-shadow: 0 1px 6px rgba(0,0,0,.1); }
  table { width: 100%; border-collapse: collapse; background: var(--surface); min-width: 380px; }
  thead tr { background: var(--header-bg); }
  th { padding: 9px 12px; text-align: left; font-size: 0.72rem; font-weight: 600; color: var(--header-text); white-space: nowrap; }
  td { padding: 7px 12px; font-size: 0.82rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tbody tr:nth-child(even) { background: var(--row-alt); }
  tbody tr:hover { background: var(--row-hover); }
  .month-cell { color: var(--muted); font-size: 0.75rem; font-variant-numeric: tabular-nums; white-space: nowrap; }

  .copy-btn {
    display: inline-flex; align-items: center; gap: 4px;
    border: 1px solid var(--border); border-radius: 5px;
    padding: 3px 9px; font-size: 0.78rem; cursor: pointer;
    white-space: nowrap; font-variant-numeric: tabular-nums;
    background: transparent; color: var(--text); transition: all .12s;
  }
  .copy-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--row-hover); }
  .copy-btn.copied {
    background: var(--success-bg); border-color: var(--success-border);
    color: var(--success);
  }
  .copy-btn svg { width: 11px; height: 11px; flex-shrink: 0; }
  .empty { color: var(--muted); font-size: 0.75rem; }
  .no-results { text-align: center; padding: 24px; color: var(--muted); font-size: 0.85rem; }
  .error { color: #dc2626; font-size: 0.8rem; margin-top: 8px; }
</style>
</head>
<body>

<h1>📊 Excel to Grid Tool</h1>
<div class="sub">Paste your tab-separated data below and click Convert</div>

<div class="paste-section">
  <label>PASTE DATA HERE</label>
  <textarea id="input" placeholder="Month	Year	ContributionPaid	ChallanRealisedDate
10	2010	5981	13-May-11
11	2010	5610	13-May-11
..."></textarea>
  <div class="hint">Accepts tab-separated data with or without header row. Date format: dd-Mon-yy (e.g. 13-May-11)</div>
  <div id="error" class="error"></div>
  <div class="btn-row">
    <button class="btn btn-primary" onclick="convert()">Convert</button>
    <button class="btn btn-secondary" onclick="clearAll()">Clear</button>
  </div>
</div>

<div id="result-section">
  <div class="toolbar">
    <input type="text" id="search" placeholder="Filter by month or year…" oninput="filterTable()">
    <span class="count" id="count"></span>
  </div>
  <div class="tbl-wrap">
    <table>
      <thead>
        <tr>
          <th>Month</th>
          <th>Contribution Paid</th>
          <th>Challan Realised Date</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<script>
const MONTH_MAP = {
  jan:'01',feb:'02',mar:'03',apr:'04',may:'05',jun:'06',
  jul:'07',aug:'08',sep:'09',oct:'10',nov:'11',dec:'12'
};

const copyIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>';
const checkIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>';

let ALL_ROWS = [];

function isValidDate(d) {
  d = (d || '').trim();
  if (!d) return true; // empty is allowed
  const parts = d.split('-');
  if (parts.length !== 3) return false;
  const [day, mon, yr] = parts;
  const mm = MONTH_MAP[mon.toLowerCase().slice(0,3)];
  if (!mm) return false;
  if (isNaN(parseInt(day)) || isNaN(parseInt(yr))) return false;
  return true;
}

function convertDate(d) {
  d = (d || '').trim();
  if (!d) return '';
  const parts = d.split('-');
  if (parts.length !== 3) return d;
  const [day, mon, yr] = parts;
  const mm = MONTH_MAP[mon.toLowerCase().slice(0,3)];
  if (!mm) return d;
  const yrNum = parseInt(yr);
  const yrFull = (yrNum < 50 ? '20' : '19') + yr.padStart(2,'0');
  return `${day.padStart(2,'0')}/${mm}/${yrFull}`;
}

function showError(msg) {
  const el = document.getElementById('error');
  el.textContent = msg;
  el.style.cssText = 'color:#dc2626;font-size:0.82rem;margin-top:8px;padding:8px 12px;background:#fef2f2;border:1px solid #fecaca;border-radius:6px;';
}

function convert() {
  const raw = document.getElementById('input').value.trim();
  document.getElementById('error').textContent = '';
  document.getElementById('error').style.cssText = '';
  if (!raw) {
    showError('⚠️ Please paste some data first.');
    return;
  }

  const lines = raw.split('\n').map(l => l.trimEnd()).filter(l => l);
  const rows = [];
  const errors = [];

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    const parts = line.split('\t');

    // Skip header row
    if (isNaN(parseInt(parts[0])) || isNaN(parseInt(parts[1]))) continue;

    const lineNum = i + 1;

    // Check too many columns
    if (parts.length > 4) {
      errors.push(`Row ${lineNum}: Too many columns (${parts.length} found, expected 4: Month, Year, ContributionPaid, ChallanRealisedDate). Please paste correctly.`);
      continue;
    }

    if (parts.length < 3) continue;

    const m = parts[0].trim();
    const y = parts[1].trim();
    const c = parts[2].trim();
    const d = parts[3] ? parts[3].trim() : '';

    // Validate date
    if (d && !isValidDate(d)) {
      errors.push(`Row ${lineNum}: "${d}" is not a valid date. Expected format: dd-Mon-yy (e.g. 13-May-11).`);
      continue;
    }

    const monthFmt = `${m.padStart(2,'0')}-${y}`;
    const dateFmt = convertDate(d);
    rows.push([monthFmt, c, dateFmt]);
  }

  if (errors.length) {
    showError('⚠️ ' + errors.join('\n'));
    return;
  }

  if (!rows.length) {
    showError('⚠️ No valid data found. Make sure columns are separated by tabs.');
    return;
  }

  ALL_ROWS = rows;
  document.getElementById('search').value = '';
  document.getElementById('result-section').style.display = 'block';
  renderRows(ALL_ROWS);
}

function markCopied(btn, value) {
  btn.innerHTML = checkIcon + ' ' + value;
  btn.style.cssText += ';background:#dcfce7!important;border-color:#86efac!important;color:#15803d!important;';
}

function makeBtn(value) {
  const btn = document.createElement('button');
  btn.className = 'copy-btn';
  btn.innerHTML = copyIcon + ' ' + value;
  btn.addEventListener('click', function() {
    // Always try to copy
    const ta = document.createElement('textarea');
    ta.value = value;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    ta.style.top = '0';
    ta.style.left = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try { document.execCommand('copy'); } catch(e) {}
    document.body.removeChild(ta);
    // Also try modern API
    if (navigator.clipboard) {
      navigator.clipboard.writeText(value).catch(() => {});
    }
    markCopied(btn, value);
  });
  return btn;
}

function renderRows(rows) {
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="3" class="no-results">No matching rows</td></tr>';
    document.getElementById('count').textContent = '0 rows';
    return;
  }
  document.getElementById('count').textContent = rows.length + ' row' + (rows.length !== 1 ? 's' : '');
  rows.forEach(([month, contrib, date]) => {
    const tr = document.createElement('tr');

    const tdM = document.createElement('td');
    tdM.className = 'month-cell';
    tdM.textContent = month;
    tr.appendChild(tdM);

    const tdC = document.createElement('td');
    tdC.appendChild(makeBtn(contrib));
    tr.appendChild(tdC);

    const tdD = document.createElement('td');
    if (date) {
      tdD.appendChild(makeBtn(date));
    } else {
      tdD.innerHTML = '<span class="empty">—</span>';
    }
    tr.appendChild(tdD);
    tbody.appendChild(tr);
  });
}

function filterTable() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  if (!q) { renderRows(ALL_ROWS); return; }
  renderRows(ALL_ROWS.filter(r => r[0].toLowerCase().includes(q)));
}

function clearAll() {
  document.getElementById('input').value = '';
  document.getElementById('error').textContent = '';
  document.getElementById('result-section').style.display = 'none';
  document.getElementById('tbody').innerHTML = '';
  ALL_ROWS = [];
}
</script>
</body>
</html>
